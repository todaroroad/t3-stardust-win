<head>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.45 var(--font-sans, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif);

    font-size: 12.5px;

    grid-template-columns: repeat(2, minmax(0, 1fr));

    display: flex;

  .beat {

    position: relative;

  .mini-row span {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--muted-foreground, #9a9aa6);
  }
  .mini-row canvas {
    width: 100%;
    height: 36px;
    border-radius: 18px;
    display: block;
    border: 1px solid rgba(255,255,255,0.12);
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: var(--radius, 12px);
    background: var(--card, #1b1b20);
    border: 1px solid var(--border, rgba(255,255,255,0.09));
    font-size: 11.5px;
    color: var(--muted-foreground, #9a9aa6);
    flex-wrap: wrap;
  }
  .btns { display: flex; gap: 6px; }
  .btn {
    border: 0;
    border-radius: 8px;
    padding: 5px 11px;
    font: inherit;

    color: var(--foreground, #fff);
  }
  .btn.primary {
    background: var(--primary, #ff5a1f);
    color: var(--primary-foreground, #fff);
  }
</style>

<body>
<p class="lead">保留同样爽快的 5 档星舰发射弧线，另外做出两套截然不同的高完成度风格供你对比：<b>风格 1「16-Bit 街机高精像素风」</b>（合金弹头/宇宙巡航机级像素火箭、圆润火焰烟球与星海）与 <b>风格 2「赛博机甲 HUD 霓虹风」</b>（高达/EVA 遥测网格、流体光带尾迹与曲速能量护盾）。每张卡下方都带 5 档实景动态条，可直接拖动或点下方连升演示。</p>

<script>
const LEVELS = ['低', '中', '高', '超高', 'Max'];
const BEATS_PX = [
  '发射台待命 · 液氧像素微雾',
  '猛禽点火 · 街机火球翻涌',
  '突破音障 · 音爆云环破云',
  '大气边缘 · 蓝地与紫青羽流',
  '深空超巡 · 16-Bit 曲速星海',
];
const BEATS_CY = [
  'STANDBY · 冷态遥测锁定',
  'IGNITION · 推力过载起燃',
  'MAX-Q · 气动音爆突破',
  'ORBITAL · 轨道等离子跃升',
  'HYPERDRIVE · 深空全频超巡',
];
const ACCENTS = ['#6FA8FF', '#FFA436', '#FF5926', '#E04CFF', '#3CF6FF'];
const FLASHES = ['#96C6FF', '#FFDB78', '#FFB36B', '#F5A6FF', '#C4FFFF'];

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t){ return a + (b - a) * t; }
function smoothstep(a, b, x){ const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function hexRgb(h){ h = h.replace('#',''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
function mixRgb(c1, c2, t){
  const k = clamp(t, 0, 1);
  return `rgb(${Math.round(lerp(c1[0],c2[0],k))},${Math.round(lerp(c1[1],c2[1],k))},${Math.round(lerp(c1[2],c2[2],k))})`;
}
function sampleColor(list, r){
  const u = clamp(r, 0, 1) * (list.length - 1);
  const i = Math.min(list.length - 2, Math.floor(u));
  return mixRgb(hexRgb(list[i]), hexRgb(list[i+1]), u - i);
}

function mkRng(seed){ let s = seed; return () => ((s = (s * 16807) % 2147483647) - 1) / 2147483646; }
const R = mkRng(4099);
const STARS = Array.from({length: 76}, () => ({
  x: R(), y: R(), z: 0.35 + R() * 1.15, ph: R() * 6.28,
  col: R() > 0.72 ? '#78F8FF' : R() > 0.45 ? '#FFE58F' : '#FFFFFF',
  big: R() > 0.82
}));
const CLOUDS = Array.from({length: 12}, () => ({
  x: R(), y: 0.14 + R() * 0.72, w: 12 + R() * 16, h: 3 + R() * 3, sp: 0.6 + R() * 1.0
}));

// =========================================================================
// STYLE 1: 16-BIT HI-BIT ARCADE PIXEL ART (Metal Slug / Gradius caliber!)
// Drawn onto a crisp art canvas (216 x 32 art px), nearest-neighbor blitted!
// =========================================================================
const PX_H = 32;

function pxRect(g, x, y, w, h, c) {
  g.fillStyle = c;
  g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function pxCircle(g, cx, cy, r, c) {
  const ir = Math.max(1, Math.round(r));
  const ix = Math.round(cx), iy = Math.round(cy);
  g.fillStyle = c;
  for (let dy = -ir; dy <= ir; dy++) {
    const dx = Math.floor(Math.sqrt(ir * ir - dy * dy + 0.25));
    g.fillRect(ix - dx, iy + dy, dx * 2 + 1, 1);
  }
}

// Hand-crafted 16-bit arcade Starship sprite (22 x 13 art px, unmistakably a Starship!)
function drawPixelStarship(g, cx, cy, p, t) {
  const x = Math.round(cx), y = Math.round(cy);
  const accent = p < 0.18 ? '#64B8FF' : p < 0.65 ? '#FFB636' : p < 0.88 ? '#FF66F5' : '#4CF8FF';

  // Aft delta fins (top & bottom)
  pxRect(g, x - 11, y - 6, 4, 2, '#53688C');
  pxRect(g, x - 9, y - 5, 4, 2, '#8CA4C8');
  pxRect(g, x - 11, y + 5, 4, 2, '#2B364E');
  pxRect(g, x - 9, y + 4, 4, 2, '#4A5B7A');

  // Forward aero flaps near nose
  pxRect(g, x + 3, y - 5, 3, 2, '#9EB8DC');
  pxRect(g, x + 3, y + 4, 3, 2, '#3B4A68');

  // Engine bell housing
  pxRect(g, x - 11, y - 2, 2, 5, '#252F45');
  if (p > 0.08) {
    const bellCol = p > 0.65 ? '#B8FFFF' : '#FFF7C2';
    pxRect(g, x - 12, y - 2, 1, 1, bellCol);
    pxRect(g, x - 12, y, 1, 1, '#FFFFFF');
    pxRect(g, x - 12, y + 2, 1, 1, bellCol);
  }

  // Main fuselage (classic 4-shade metallic pixel shading + dark heatshield belly)
  pxRect(g, x - 9, y - 3, 15, 1, '#FFFFFF');   // top specular highlight
  pxRect(g, x - 9, y - 2, 16, 2, '#DAE6F8');   // stainless steel body
  pxRect(g, x - 9, y, 16, 1, '#8FA5C7');       // mid-hull shadow
  pxRect(g, x - 9, y + 1, 15, 2, '#1E273B');   // black ceramic heatshield
  pxRect(g, x - 9, y + 3, 13, 1, '#111726');   // underside shadow

  // Pointed ogive nosecone
  pxRect(g, x + 6, y - 2, 3, 4, '#E8F0FC');
  pxRect(g, x + 6, y - 2, 2, 1, '#FFFFFF');
  pxRect(g, x + 9, y - 1, 2, 2, '#FFFFFF');
  pxRect(g, x + 11, y, 1, 1, '#CBE6FF');
  pxRect(g, x + 6, y + 1, 3, 1, '#1E273B');

  // Panel weld seams + glowing cockpit window
  pxRect(g, x - 4, y - 3, 1, 4, '#6A7F9E');
  pxRect(g, x + 1, y - 3, 1, 4, '#6A7F9E');
  pxRect(g, x + 4, y - 2, 3, 1, accent);
  pxRect(g, x + 5, y - 2, 1, 1, '#FFFFFF');

  // Max-Q pixel vapor cone at High (0.42..0.72)
  const cone = Math.sin(smoothstep(0.38, 0.72, p) * Math.PI);
  if (cone > 0.12) {
    g.globalAlpha = cone * 0.75;
    pxRect(g, x + 9, y - 2, 1, 5, '#FFFFFF');
    pxRect(g, x + 7, y - 5, 2, 2, '#D8F0FF');
    pxRect(g, x + 7, y + 4, 2, 2, '#D8F0FF');
    pxRect(g, x + 4, y - 8, 2, 3, '#A8DCFF');
    pxRect(g, x + 4, y + 6, 2, 3, '#A8DCFF');
    pxRect(g, x + 1, y - 10, 2, 2, '#80C8FF');
    pxRect(g, x + 1, y + 9, 2, 2, '#80C8FF');
    g.globalAlpha = 1;
  }

  // Max deep-space pixel bow shield + wingtip streaks
  const bow = smoothstep(0.82, 1.0, p);
  if (bow > 0.05) {
    g.globalAlpha = bow * 0.88;
    // Wingtip cyan contrails
    for (const wy of [-6, 6]) {
      pxRect(g, x - 28, y + wy, 17, 1, '#4AF6FF');
      pxRect(g, x - 42, y + wy, 14, 1, '#9E5CFF');
    }
    // Curved pixel bow shock in front of nose
    pxRect(g, x + 13, y - 2, 1, 5, '#FFFFFF');
    pxRect(g, x + 12, y - 5, 1, 3, '#4DF8FF');
    pxRect(g, x + 12, y + 3, 1, 3, '#4DF8FF');
    pxRect(g, x + 10, y - 7, 2, 2, '#9A6BFF');
    pxRect(g, x + 10, y + 6, 2, 2, '#9A6BFF');
    // Nose 4-point pixel star
    const sp = (Math.floor(t * 10) % 2) ? 4 : 3;
    pxRect(g, x + 13 - sp, y, sp * 2 + 1, 1, '#FFFFFF');
    pxRect(g, x + 13, y - sp, 1, sp * 2 + 1, '#FFFFFF');
    g.globalAlpha = 1;
  }
}

function createPxParticles(count = 44) {
  return Array.from({length: count}, () => ({
    active: false, x: 0, y: 0, vx: 0, vy: 0, age: 0, life: 1, r0: 1, r1: 4, kind: 0
  }));
}

function stepPxParticles(pool, dt, p, nx, ny, W) {
  const rate = p < 0.08 ? 10 : lerp(36, 95, p);
  let budget = rate * dt;
  for (let i = 0; i < pool.length; i++) {
    const pt = pool[i];
    if (pt.active) {
      pt.age += dt;
      if (pt.age >= pt.life || pt.x < -16) pt.active = false;
      else {
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.vx *= Math.pow(0.96, dt * 60);
        if (pt.kind === 0) pt.vy -= 8 * dt;
      }
    }
    if (!pt.active && budget >= 1) {
      budget -= 1;
      pt.active = true; pt.age = 0;
      if (p < 0.14) {
        pt.kind = 0;
        pt.x = nx + (Math.random() - 0.2) * 10;
        pt.y = ny + (Math.random() - 0.5) * 6;
        pt.vx = -4 + (Math.random() - 0.5) * 6;
        pt.vy = -5 - Math.random() * 5;
        pt.life = 0.65 + Math.random() * 0.45;
        pt.r0 = 1; pt.r1 = 3.2;
      } else if (p < 0.44) {
        // Metal Slug style round pixel smoke & fire puffs!
        pt.kind = Math.random() > 0.52 ? 2 : 1;
        pt.x = nx - Math.random() * 4;
        pt.y = ny + (Math.random() - 0.5) * 3;
        pt.vx = -32 - Math.random() * 58;
        pt.vy = (Math.random() - 0.5) * 26;
        pt.life = pt.kind === 2 ? (0.22 + Math.random() * 0.2) : (0.45 + Math.random() * 0.35);
        pt.r0 = pt.kind === 2 ? 1.8 : 2.2;
        pt.r1 = pt.kind === 2 ? 0.5 : 5.2;
      } else if (p < 0.68) {
        pt.kind = 2;
        pt.x = nx - Math.random() * 4;
        pt.y = ny + (Math.random() - 0.5) * 4;
        pt.vx = -85 - Math.random() * 80;
        pt.vy = (Math.random() - 0.5) * 20;
        pt.life = 0.28 + Math.random() * 0.22;
        pt.r0 = 2.0; pt.r1 = 0.8;
      } else if (p < 0.88) {
        pt.kind = 3;
        pt.x = nx - Math.random() * 3;
        pt.y = ny + (Math.random() - 0.5) * 3;
        pt.vx = -80 - Math.random() * 85;
        pt.vy = (Math.random() - 0.5) * 34; // vacuum fan
        pt.life = 0.32 + Math.random() * 0.24;
        pt.r0 = 1.6; pt.r1 = 3.8;
      } else {
        pt.kind = 4;
        pt.x = nx - Math.random() * 3;
        pt.y = ny + (Math.random() - 0.5) * 3;
        pt.vx = -125 - Math.random() * 115;
        pt.vy = (Math.random() - 0.5) * 18;
        pt.life = 0.26 + Math.random() * 0.22;
        pt.r0 = 1.4; pt.r1 = 0.7;
      }
    }
  }
}

function drawPixelScene(g, W, p, kxRatio, t, particles, shock) {
  const H = PX_H;
  const cy = Math.floor(H / 2);

  // 1. Stepped 16-bit sky palette bands with classic arcade horizon glow
  const skyBandsTop = ['#0A1530', '#1E1432', '#0D2F7A', '#0A0826', '#02040B'];
  const skyBandsMid = ['#122652', '#4D1E14', '#2252A8', '#1A0C44', '#05081A'];
  const skyBandsBot = ['#183263', '#8C3412', '#CC531A', '#241054', '#080D24'];
  const cTop = sampleColor(skyBandsTop, p);
  const cMid = sampleColor(skyBandsMid, p);
  const cBot = sampleColor(skyBandsBot, p);
  pxRect(g, 0, 0, W, 11, cTop);
  pxRect(g, 0, 11, W, 11, cMid);
  pxRect(g, 0, 22, W, H - 22, cBot);
  // Subtle Bayer-style dither seam between sky bands
  for (let x = 0; x < W; x += 2) {
    pxRect(g, x, 10, 1, 1, cMid);
    pxRect(g, x + 1, 11, 1, 1, cTop);
    pxRect(g, x, 21, 1, 1, cBot);
    pxRect(g, x + 1, 22, 1, 1, cMid);
  }

  // 2. Pixel nebula bands & crisp stars (XHigh -> Max)
  const neb = smoothstep(0.60, 1.0, p);
  if (neb > 0.05) {
    g.globalAlpha = neb * 0.35;
    pxCircle(g, W * 0.72, 12, 26, '#26D8FF');
    pxCircle(g, W * 0.56, 18, 22, '#8F3BFF');
    pxCircle(g, W * 0.36, 20, 18, '#FF32B8');
    g.globalAlpha = 1;
  }
  const starVis = p < 0.25 ? lerp(0.55, 0.15, p / 0.25) : smoothstep(0.45, 0.92, p);
  const streak = smoothstep(0.74, 1.0, p);
  if (starVis > 0.05) {
    for (let i = 0; i < STARS.length; i++) {
      const s = STARS[i];
      const spd = streak > 0.05 ? lerp(12, 140, streak) * s.z : 0;
      const sx = W - ((s.x * W + t * spd) % W);
      const sy = Math.floor(s.y * (H - 3)) + 1;
      const tw = (Math.sin(t * 4 + s.ph) + 1) * 0.5;
      g.globalAlpha = starVis * (0.35 + 0.65 * tw);
      if (streak > 0.1) {
        const len = Math.max(2, Math.round((3 + s.z * 9) * streak));
        pxRect(g, sx, sy, len, 1, s.col);
        pxRect(g, sx, sy, 2, 1, '#FFFFFF');
      } else {
        pxRect(g, sx, sy, 1, 1, s.col);
      }
      if (s.big && p > 0.8 && tw > 0.6) {
        pxRect(g, sx - 2, sy, 5, 1, '#FFFFFF');
        pxRect(g, sx, sy - 2, 1, 5, '#FFFFFF');
      }
    }
    g.globalAlpha = 1;
  }

  // 3. Pixel Launch Pad & Gantry (Low -> recedes during Medium)
  const padVis = 1 - smoothstep(0.18, 0.44, p);
  if (padVis > 0.04) {
    const sh = Math.round(-smoothstep(0.12, 0.44, p) * 48);
    g.globalAlpha = padVis;
    pxRect(g, sh, H - 4, W + 48, 4, '#1B2D52');
    pxRect(g, sh, H - 4, W + 48, 1, '#4C74B8');
    // Spotlight pixel diagonal beam
    g.globalAlpha = padVis * 0.22;
    for (let i = 0; i < 16; i++) {
      pxRect(g, sh + 12 + i, H - 5 - i, 12 + Math.floor(i * 0.5), 1, p > 0.14 ? '#FFBA5A' : '#85C8FF');
    }
    g.globalAlpha = padVis;
    // Mechazilla tower truss
    const tx = sh + 8;
    pxRect(g, tx, 4, 1, H - 8, '#5373A8');
    pxRect(g, tx + 5, 4, 1, H - 8, '#5373A8');
    for (let ty = 6; ty < H - 6; ty += 4) {
      pxRect(g, tx + 1, ty, 4, 1, '#3D5682');
      pxRect(g, tx + 2, ty + 1, 2, 1, '#2D4166');
    }
    const open = Math.round(smoothstep(0.1, 0.28, p) * 4);
    pxRect(g, tx + 6, 10 - open, 8, 1, '#85A6DB');
    pxRect(g, tx + 6, 20 + open, 8, 1, '#85A6DB');
    // Red blinking tower beacon
    if (Math.floor(t * 2.5) % 2 === 0) pxRect(g, tx + 2, 2, 2, 2, '#FF4D5E');
    else pxRect(g, tx + 2, 2, 2, 2, '#6E1E2B');
    g.globalAlpha = 1;
  }

  // 4. Pixel clouds at Medium -> High
  const cloudVis = Math.sin(smoothstep(0.22, 0.72, p) * Math.PI);
  if (cloudVis > 0.05) {
    g.globalAlpha = cloudVis * 0.35;
    for (const c of CLOUDS) {
      const cx = W - ((c.x * W + t * lerp(28, 130, p) * c.sp) % (W + 30)) + 15;
      const cyc = Math.round(c.y * H);
      pxRect(g, cx, cyc, c.w, c.h, '#DCEBFF');
      pxRect(g, cx + 2, cyc - 1, c.w - 4, 1, '#FFFFFF');
    }
    g.globalAlpha = 1;
  }

  // 5. Pixel Earth horizon (XHigh) -> receding pixel Earth (Max)
  const limb = smoothstep(0.56, 0.78, p) * (1 - smoothstep(0.84, 0.98, p));
  if (limb > 0.04) {
    g.globalAlpha = limb;
    const ex = Math.round(W * 0.34), ey = H + 56;
    pxCircle(g, ex, ey, 68, '#66F0FF');
    pxCircle(g, ex, ey, 66, '#1E7BFF');
    pxCircle(g, ex, ey, 62, '#0B2F7A');
    g.globalAlpha = 1;
  }
  const planet = smoothstep(0.80, 0.98, p);
  if (planet > 0.04) {
    g.globalAlpha = planet;
    pxCircle(g, 18, H - 10, 9, 'rgba(65,235,255,0.45)');
    pxCircle(g, 18, H - 10, 7, '#228BFF');
    pxCircle(g, 20, H - 12, 4, '#8FF2FF');
    pxRect(g, 15, H - 11, 4, 1, '#FFFFFF'); // tiny pixel cloud band
    pxRect(g, 17, H - 8, 5, 1, '#0B2A6B');
    g.globalAlpha = 1;
  }

  // 6. Starship position & organic multi-layered pixel exhaust plume (ZERO hard trapezoids!)
  const shipX = clamp(Math.round(24 + kxRatio * (W - 44)), 24, W - 18);
  const bob = p < 0.08 ? 0 : Math.round(Math.sin(t * 10) * (p > 0.6 ? 1 : 0.6));
  const shipY = cy + bob;
  const nx = shipX - 12, ny = shipY;

  if (p >= 0.08) {
    const power = clamp(Math.pow((p - 0.08) / 0.92, 0.55), 0, 1);
    const len = Math.round(lerp(24, 96, power));
    const vac = smoothstep(0.54, 0.80, p);
    const warp = smoothstep(0.82, 1.0, p);
    const steps = 16;
    for (let i = steps - 1; i >= 0; i--) {
      const u = i / (steps - 1);
      const dist = 2 + u * len;
      const bell = Math.sin(Math.pow(u, 0.72) * Math.PI);
      const expand = vac > 0.3 ? lerp(1, 1.45, u) * (1 - warp * 0.45) : (1 - u * 0.25);
      const r = Math.max(1, (1.8 + bell * lerp(3.2, 6.2, power)) * expand);
      const sway = Math.round(Math.sin(t * 20 - u * 7) * (0.4 + u * 1.1) * (1 - warp * 0.6));
      const bx = nx - dist, by = ny + sway;
      g.globalAlpha = Math.pow(1 - u, 1.15) * (0.55 + 0.4 * bell) * power;
      if (warp > 0.5) {
        pxCircle(g, bx, by, r + 1.2, '#7D3CFF');
        pxCircle(g, bx, by, r * 0.75, '#2EF2FF');
        if (u < 0.65) pxCircle(g, bx, by, Math.max(1, r * 0.4), '#FFFFFF');
      } else if (vac > 0.35) {
        pxCircle(g, bx, by, r + 1.2, '#D946EF');
        pxCircle(g, bx, by, r * 0.72, '#5EE8FF');
        if (u < 0.55) pxCircle(g, bx, by, Math.max(1, r * 0.4), '#FFFFFF');
      } else {
        pxCircle(g, bx, by, r + 1, '#E63B12');
        pxCircle(g, bx, by, r * 0.75, '#FFA822');
        if (u < 0.6) pxCircle(g, bx, by, Math.max(1, r * 0.45), '#FFF8C4');
      }
    }
    g.globalAlpha = 1;
  }

  // 7. Pixel particles (round smoke puffs, fiery sparks, plasma scatter)
  for (let i = 0; i < particles.length; i++) {
    const pt = particles[i];
    if (!pt.active) continue;
    const u = pt.age / pt.life;
    const fade = Math.sin(u * Math.PI);
    const r = lerp(pt.r0, pt.r1, u);
    g.globalAlpha = fade * (pt.kind === 0 ? 0.35 : 0.85);
    if (pt.kind === 0) pxCircle(g, pt.x, pt.y, r, '#C6E2FF');
    else if (pt.kind === 1) {
      pxCircle(g, pt.x, pt.y, r, u < 0.4 ? '#FFE2B8' : '#C4A69E');
      if (r > 2) pxCircle(g, pt.x - 1, pt.y - 1, r * 0.5, '#FFF5E6');
    } else if (pt.kind === 2) {
      pxRect(g, pt.x, pt.y, Math.max(1, r), 1, u < 0.45 ? '#FFF9B8' : '#FF7B1C');
    } else if (pt.kind === 3) {
      pxCircle(g, pt.x, pt.y, Math.max(1, r * 0.7), u < 0.4 ? '#80F6FF' : '#E964FF');
    } else {
      pxRect(g, pt.x, pt.y, 3, 1, u < 0.45 ? '#FFFFFF' : '#40F4FF');
    }
  }
  g.globalAlpha = 1;

  // 8. Starship hero sprite on top
  drawPixelStarship(g, shipX, shipY, p, t);

  // 9. Pixel upshift shockwave ring
  if (shock > 0.05) {
    g.globalAlpha = shock * 0.9;
    const rad = Math.round(8 + (1 - shock) * 44);
    const col = sampleColor(FLASHES, p);
    for (let k = 0; k < 24; k++) {
      const a = (k / 24) * Math.PI * 2;
      pxRect(g, shipX + Math.cos(a) * rad, shipY + Math.sin(a) * rad * 0.45, 2, 1, col);
    }
    g.globalAlpha = 1;
  }

  return { nx, ny };
}

// =========================================================================
// STYLE 2: CYBER-NEON MECHA HUD / ANIME OVERDRIVE (EVA / Cyberpunk vibe!)
// Razor-sharp telemetry grid + glowing cel-shaded Starship + fluid energy ribbons!
// =========================================================================
function drawCyberStarship(ctx, x, y, angle, p, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  const neon = sampleColor(ACCENTS, p);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const aura = ctx.createRadialGradient(0, 0, 2, 0, 0, 24);
  aura.addColorStop(0, neon); aura.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = 0.25 + p * 0.4;
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // Sharp swept mecha wings with glowing neon leading edges
  ctx.fillStyle = '#0D1322';
  ctx.beginPath();
  ctx.moveTo(-12, -3.5); ctx.lineTo(-18, -11); ctx.lineTo(-9, -10.5); ctx.lineTo(-4, -4.5); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-12, 3.5); ctx.lineTo(-18, 11); ctx.lineTo(-9, 10.5); ctx.lineTo(-4, 4.5); ctx.closePath(); ctx.fill();

  ctx.strokeStyle = neon; ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.moveTo(-17.5, -10.8); ctx.lineTo(-9, -10.4); ctx.lineTo(-4, -4.5);
  ctx.moveTo(-17.5, 10.8); ctx.lineTo(-9, 10.4); ctx.lineTo(-4, 4.5);
  ctx.stroke();

  // Forward canard fins
  ctx.fillStyle = '#18223A';
  ctx.beginPath(); ctx.moveTo(6, -3.8); ctx.lineTo(3.5, -7.5); ctx.lineTo(8.5, -6.2); ctx.lineTo(11, -2.8); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(6, 3.8); ctx.lineTo(3.5, 7.5); ctx.lineTo(8.5, 6.2); ctx.lineTo(11, 2.8); ctx.closePath(); ctx.fill();

  // Cel-shaded obsidian + titanium mecha hull
  const hull = ctx.createLinearGradient(0, -5, 0, 5);
  hull.addColorStop(0, '#F5F9FF');
  hull.addColorStop(0.32, '#9BB4D8');
  hull.addColorStop(0.52, '#1A243D');
  hull.addColorStop(1, '#090E1C');
  ctx.fillStyle = hull;
  ctx.beginPath();
  ctx.moveTo(18, 0);
  ctx.lineTo(9, -4.8); ctx.lineTo(-14, -4.6); ctx.lineTo(-15.5, -2.8);
  ctx.lineTo(-15.5, 2.8); ctx.lineTo(-14, 4.6); ctx.lineTo(9, 4.8);
  ctx.closePath(); ctx.fill();

  // Razor-sharp glowing energy spine along center of fuselage
  ctx.strokeStyle = neon; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(13, 0); ctx.stroke();
  ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.moveTo(-13, 0); ctx.lineTo(11, 0); ctx.stroke();

  // Glowing cockpit visor
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(7, -2.2); ctx.lineTo(5.5, -2.2); ctx.lineTo(8.5, 0); ctx.closePath(); ctx.fill();

  // Outer mecha rim outline
  ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 0.75;
  ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(9, -4.8); ctx.lineTo(-14, -4.6); ctx.stroke();

  // High (Max-Q) & Max holographic sonic / AT-field energy rings ahead of nose!
  const field = smoothstep(0.42, 1.0, p);
  if (field > 0.05) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const rings = p > 0.8 ? 3 : 2;
    for (let r = 0; r < rings; r++) {
      const rx = 14 - r * 5 + Math.sin(t * 14 + r) * 0.8;
      const ry = 8 + r * 5.5;
      ctx.strokeStyle = r === 0 ? '#FFFFFF' : neon;
      ctx.globalAlpha = (0.72 - r * 0.18) * field;
      ctx.lineWidth = r === 0 ? 1.6 : 1.0;
      ctx.beginPath(); ctx.ellipse(rx, 0, 3.2, ry, 0, -Math.PI * 0.65, Math.PI * 0.65); ctx.stroke();
    }
    if (p > 0.82) {
      const bow = smoothstep(0.82, 1.0, p);
      // Hexagonal holographic energy shield flare at Max!
      ctx.strokeStyle = `rgba(90, 250, 255, ${0.85 * bow})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * Math.PI * 2 + t * 1.2;
        const hx = 17 + Math.cos(a) * 3.5;
        const hy = Math.sin(a) * 11;
        if (k === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
      }
      ctx.closePath(); ctx.stroke();
    }
    ctx.restore();
  }

  ctx.restore();
}

function drawCyberScene(ctx, w, h, p, kx, t, shock) {
  const cy = h / 2;
  const neon = sampleColor(ACCENTS, p);

  // 1. Deep obsidian cyber backdrop with dramatic per-tier color temperature
  const bg0 = ['#060B17', '#1B0B08', '#140E2A', '#170528', '#02040D'];
  const bg1 = ['#0C1933', '#3E160A', '#0D2966', '#2B0848', '#06142B'];
  const bg = ctx.createLinearGradient(0, 0, w, 0);
  bg.addColorStop(0, sampleColor(bg0, p));
  bg.addColorStop(0.6, sampleColor(bg1, p));
  bg.addColorStop(1, sampleColor(bg0, p));
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

  // 2. Scrolling holographic telemetry grid & altitude rulers (speed scales smoothly with effort!)
  const gridSpd = p < 0.08 ? 0 : lerp(22, 260, Math.pow(p, 1.2));
  const stepX = 24;
  const offX = (t * gridSpd) % stepX;
  ctx.save();
  ctx.strokeStyle = neon;
  ctx.globalAlpha = lerp(0.14, 0.24, p);
  ctx.lineWidth = 0.7;
  for (let x = -offX; x < w + stepX; x += stepX) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  // Horizontal horizon / flight telemetry line
  ctx.globalAlpha = 0.18;
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
  // Top & bottom subtle altitude tick marks
  ctx.globalAlpha = 0.35;
  for (let x = -offX; x < w + stepX; x += 8) {
    const tall = Math.round((x + offX) / 8) % 3 === 0 ? 4 : 2;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, tall); ctx.moveTo(x, h); ctx.lineTo(x, h - tall); ctx.stroke();
  }
  ctx.restore();

  // 3. Wireframe Earth orbital curve (XHigh) -> holographic planet reticle (Max)
  const limb = smoothstep(0.54, 0.80, p) * (1 - smoothstep(0.84, 0.98, p));
  if (limb > 0.02) {
    ctx.save();
    ctx.globalAlpha = limb;
    const ex = w * 0.38, ey = h + 108;
    const eg = ctx.createRadialGradient(ex, ey, 90, ex, ey, 130);
    eg.addColorStop(0, 'rgba(18,48,130,0.7)');
    eg.addColorStop(0.82, 'rgba(60,210,255,0.65)');
    eg.addColorStop(0.92, 'rgba(225,85,255,0.5)');
    eg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = eg; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#6CF6FF'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(ex, ey, 118, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ctx.restore();
  }
  const planet = smoothstep(0.80, 0.98, p);
  if (planet > 0.02) {
    ctx.save();
    ctx.globalAlpha = planet;
    const px = 26, py = cy, pr = 11;
    // Holographic wireframe planet + orbital target ring
    const pg = ctx.createRadialGradient(px + 3, py - 3, 1, px, py, pr * 1.8);
    pg.addColorStop(0, '#9EF8FF'); pg.addColorStop(0.45, '#1D74FF'); pg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(px, py, pr * 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#5CF6FF'; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(px, py, pr * 1.5, pr * 0.42, -0.35, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // 4. High-contrast stars & cyber speed streaks (High -> Max)
  const starVis = smoothstep(0.35, 0.92, p);
  const streak = smoothstep(0.55, 1.0, p);
  if (starVis > 0.02) {
    for (let i = 0; i < STARS.length; i++) {
      const s = STARS[i];
      const spd = lerp(30, 290, streak) * s.z;
      const sx = w - ((s.x * w + t * spd) % w);
      const sy = s.y * h;
      const len = 5 + streak * 24 * s.z;
      const sg = ctx.createLinearGradient(sx, sy, sx + len, sy);
      sg.addColorStop(0, s.col); sg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = starVis * (0.4 + 0.6 * Math.abs(Math.sin(t * 5 + s.ph)));
      ctx.strokeStyle = sg; ctx.lineWidth = s.big ? 1.5 : 0.9;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + len, sy); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // 5. Launch gantry laser lock frame at Low (fades smoothly out at Medium)
  const lockVis = 1 - smoothstep(0.14, 0.36, p);
  if (lockVis > 0.02) {
    ctx.save();
    ctx.globalAlpha = lockVis * 0.75;
    ctx.strokeStyle = '#6FA8FF'; ctx.lineWidth = 1.2;
    const lx = 14;
    // Sci-fi launch bracket reticle around Starship
    ctx.beginPath();
    ctx.moveTo(lx, 10); ctx.lineTo(lx + 6, 10); ctx.moveTo(lx, 10); ctx.lineTo(lx, 18);
    ctx.moveTo(lx, h - 10); ctx.lineTo(lx + 6, h - 10); ctx.moveTo(lx, h - 10); ctx.lineTo(lx, h - 18);
    ctx.moveTo(lx + 42, 10); ctx.lineTo(lx + 36, 10); ctx.moveTo(lx + 42, 10); ctx.lineTo(lx + 42, 18);
    ctx.moveTo(lx + 42, h - 10); ctx.lineTo(lx + 36, h - 10); ctx.moveTo(lx + 42, h - 10); ctx.lineTo(lx + 42, h - 18);
    ctx.stroke();
    // Scanning vertical telemetry laser line
    const scanX = lx + 4 + ((t * 22) % 34);
    ctx.strokeStyle = 'rgba(110, 220, 255, 0.45)';
    ctx.beginPath(); ctx.moveTo(scanX, 11); ctx.lineTo(scanX, h - 11); ctx.stroke();
    ctx.restore();
  }

  // 6. Starship trajectory position
  const angle = lerp(-0.16, 0, smoothstep(0, 0.88, p));
  const shipX = clamp(kx + lerp(6, -2, p), 32, w - 24);
  const bob = p < 0.08 ? 0 : Math.sin(t * (7 + p * 12)) * (0.35 + p * 0.65);
  const shipY = cy + bob;
  const nx = shipX - Math.cos(angle) * 15;
  const ny = shipY - Math.sin(angle) * 15;

  // 7. Fluid Anime Multi-Strand Neon Plasma Ribbons (silky tapered sine-ribbons, ZERO hard edges!)
  if (p >= 0.08) {
    const power = clamp(Math.pow((p - 0.08) / 0.92, 0.55), 0, 1);
    const len = lerp(46, 185, power);
    const strands = p > 0.78 ? 5 : p > 0.4 ? 4 : 3;
    ctx.save();
    ctx.translate(nx, ny);
    ctx.rotate(angle);
    ctx.globalCompositeOperation = 'lighter';

    // Soft elongated radial plasma glow bed
    ctx.save();
    ctx.scale(1, lerp(12, 22, power) / (len * 0.52));
    const bed = ctx.createRadialGradient(-len * 0.3, 0, 1, -len * 0.3, 0, len * 0.58);
    bed.addColorStop(0, p > 0.8 ? 'rgba(90,252,255,0.62)' : p > 0.58 ? 'rgba(230,75,255,0.56)' : 'rgba(255,160,40,0.58)');
    bed.addColorStop(0.55, p > 0.8 ? 'rgba(120,65,255,0.28)' : p > 0.58 ? 'rgba(70,210,255,0.25)' : 'rgba(255,60,15,0.25)');
    bed.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bed;
    ctx.beginPath(); ctx.arc(-len * 0.3, 0, len * 0.58, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Flowing luminous energy ribbons (Itano / Gundam thruster style!)
    for (let s = 0; s < strands; s++) {
      const isCore = s === 0;
      const rg = ctx.createLinearGradient(0, 0, -len, 0);
      if (isCore) {
        rg.addColorStop(0, '#FFFFFF');
        rg.addColorStop(0.35, neon);
        rg.addColorStop(0.8, p > 0.6 ? 'rgba(130,60,255,0.35)' : 'rgba(255,70,15,0.35)');
        rg.addColorStop(1, 'rgba(0,0,0,0)');
      } else {
        const alt = s % 2 === 0 ? neon : (p > 0.6 ? '#FF47E8' : '#FFE066');
        rg.addColorStop(0, alt);
        rg.addColorStop(0.65, alt);
        rg.addColorStop(1, 'rgba(0,0,0,0)');
      }
      ctx.strokeStyle = rg;
      ctx.lineWidth = isCore ? lerp(2.8, 5.2, power) : lerp(1.1, 2.0, power);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      const segs = 18;
      for (let i = 1; i <= segs; i++) {
        const u = i / segs;
        const rx = -u * len;
        const spread = isCore ? 0.6 : (s % 2 ? 1 : -1) * (1.8 + Math.sin(u * Math.PI) * lerp(3.5, 10.5, power));
        const wave = Math.sin(u * 10 - t * (16 + p * 16) + s * 1.7) * (isCore ? 0.8 : 2.2) * u;
        ctx.lineTo(rx, spread + wave);
      }
      ctx.stroke();
    }

    // Pulsing cyber thrust rings moving backward along the plume
    const ringCount = p > 0.75 ? 4 : 2;
    for (let r = 0; r < ringCount; r++) {
      const u = (t * (1.6 + p * 1.4) + r / ringCount) % 1;
      const rx = -6 - u * len * 0.72;
      const ry = lerp(3.5, 11.5, u) * (0.65 + power * 0.5);
      ctx.strokeStyle = u < 0.35 ? '#FFFFFF' : neon;
      ctx.globalAlpha = (1 - u) * 0.75 * power;
      ctx.lineWidth = 1.3 * (1 - u * 0.5);
      ctx.beginPath(); ctx.ellipse(rx, 0, 2.2, ry, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  // 8. Starship hero on top
  drawCyberStarship(ctx, shipX, shipY, angle, p, t);

  // 9. Expanding cyber shockwave diamond/ring on upshift
  if (shock > 0.01) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = sampleColor(FLASHES, p);
    ctx.globalAlpha = shock * 0.9;
    ctx.lineWidth = 2.2 * shock;
    const rad = 14 + (1 - shock) * 90;
    ctx.beginPath(); ctx.ellipse(shipX, shipY, rad, rad * 0.42, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

// =========================================================================
// Shared interactive panel mounter (with 180ms Juice + 5 live mini-stages!)
// =========================================================================
function mountStylePanel(panelEl, mode, beats) {
  const dot = panelEl.querySelector('[data-dot]');
  const beatEl = panelEl.querySelector('[data-beat]');
  const well = panelEl.querySelector('[data-well]');
  const track = panelEl.querySelector('[data-track]');
  const cv = panelEl.querySelector('[data-cv]');
  const ticks = panelEl.querySelector('[data-ticks]');
  const minis = panelEl.querySelector('[data-minis]');

  const off = document.createElement('canvas');
  const octx = off.getContext('2d');
  const ctx = cv.getContext('2d');
  const art = document.createElement('canvas');
  const actx = art.getContext('2d');
  const pxPool = mode === 'pixel' ? createPxParticles(48) : null;

  const st = {
    idx: 2, val: 0.5, target: 0.5, drag: false, t: 2.2,
    hitstop: 0, flash: 0, shake: 0, recoil: 0, chroma: 0, shock: 0,
  };

  function triggerShift(nextIdx, prevIdx) {
    const up = nextIdx > prevIdx;
    if (up) {
      st.hitstop = 0.028; st.flash = 0.36; st.shake = 0.95; st.recoil = -5.5; st.chroma = 1.0; st.shock = 1.0;
    } else {
      st.hitstop = 0; st.flash = 0.1; st.shake = 0.2; st.recoil = 2.0; st.chroma = 0.3; st.shock = 0;
    }
  }

  function setIdx(i, juice = true) {
    const c = clamp(i, 0, 4);
    if (juice && c !== st.idx) triggerShift(c, st.idx);
    st.idx = c;
    st.target = c / 4;
    syncUi();
  }

  function syncUi() {
    const ratio = st.idx / 4;
    const col = sampleColor(ACCENTS, ratio);
    dot.style.background = col;
    dot.style.boxShadow = `0 0 8px ${col}`;
    beatEl.textContent = beats[st.idx];
    [...ticks.children].forEach((b, i) => b.classList.toggle('on', i === st.idx));
  }

  LEVELS.forEach((lbl, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = lbl;
    b.onclick = () => setIdx(i, true);
    ticks.append(b);
  });
  syncUi();

  // Build 5 live mini stage strips inside each style panel!
  const miniCtrls = LEVELS.map((lbl, idx) => {
    const row = document.createElement('div');
    row.className = 'mini-row';
    row.innerHTML = `<span>${lbl}</span><canvas></canvas>`;
    row.onclick = () => setIdx(idx, true);
    minis.append(row);
    const mc = row.querySelector('canvas');
    const mctx = mc.getContext('2d');
    const mart = document.createElement('canvas');
    const mactx = mart.getContext('2d');
    const mp = idx / 4;
    const mpool = mode === 'pixel' ? createPxParticles(38) : null;
    if (mpool) {
      for (let k = 0; k < 20; k++) stepPxParticles(mpool, 0.03, mp, 24 + mp * 150 - 12, 16, 200);
    }
    return { mc, mctx, mart, mactx, mp, mpool };
  });

  if (pxPool) {
    for (let k = 0; k < 22; k++) stepPxParticles(pxPool, 0.03, st.val, 24 + st.val * 165 - 12, 16, 210);
  }

  const xToRatio = (e) => {
    const r = track.getBoundingClientRect();
    return clamp((e.clientX - r.left - 28) / Math.max(20, r.width - 56), 0, 1);
  };
  track.addEventListener('pointerdown', (e) => {
    st.drag = true; track.setPointerCapture(e.pointerId);
    const r = xToRatio(e); st.target = r;
    const n = Math.round(r * 4); if (n !== st.idx) setIdx(n, true);
  });
  track.addEventListener('pointermove', (e) => {
    if (!st.drag) return;
    const r = xToRatio(e); st.target = r;
    const n = Math.round(r * 4); if (n !== st.idx) setIdx(n, true);
  });
  track.addEventListener('pointerup', () => {
    if (!st.drag) return;
    st.drag = false;
    setIdx(Math.round(st.target * 4), false);
  });

  let last = performance.now();
  function frame(now) {
    const dt = clamp((now - last) / 1000, 0.001, 0.05);
    last = now;

    const w = Math.max(160, track.clientWidth || 320);
    const h = 50;
    const dpr = Math.min(2, devicePixelRatio || 1);
    const cw = Math.round(w * dpr), ch = Math.round(h * dpr);
    if (cv.width !== cw || cv.height !== ch) {
      cv.width = cw; cv.height = ch; off.width = cw; off.height = ch;
    }

    if (st.hitstop > 0) {
      st.hitstop = Math.max(0, st.hitstop - dt);
    } else {
      st.t += dt;
      st.val += (st.target - st.val) * (st.drag ? 0.45 : 0.24);
      st.flash = Math.max(0, st.flash - dt * 4.6);
      st.shake = Math.max(0, st.shake - dt * 6.4);
      st.recoil *= Math.pow(0.0008, dt);
      st.chroma = Math.max(0, st.chroma - dt * 7.2);
      st.shock = Math.max(0, st.shock - dt * 4.5);
    }

    if (st.shake > 0.02) {
      const dx = (Math.sin(now * 0.095) * 1.7 * st.shake).toFixed(2);
      const dy = (Math.cos(now * 0.13) * 1.2 * st.shake).toFixed(2);
      well.style.transform = `translate3d(${dx}px,${dy}px,0)`;
    } else if (well.style.transform) {
      well.style.transform = '';
    }

    const pad = 28;
    const kx = pad + st.val * (w - pad * 2) + st.recoil;
    const ky = h / 2;

    if (mode === 'pixel') {
      const artW = Math.round(w / 1.56);
      if (art.width !== artW || art.height !== PX_H) { art.width = artW; art.height = PX_H; }
      actx.clearRect(0, 0, artW, PX_H);
      const { nx, ny } = drawPixelScene(actx, artW, st.val, clamp((kx - pad) / (w - pad * 2), 0, 1), st.t, pxPool, st.shock);
      if (st.hitstop <= 0) stepPxParticles(pxPool, dt, st.val, nx, ny, artW);
      octx.setTransform(1, 0, 0, 1, 0, 0);
      octx.imageSmoothingEnabled = false;
      octx.clearRect(0, 0, cw, ch);
      octx.drawImage(art, 0, 0, cw, ch);
      octx.setTransform(dpr, 0, 0, dpr, 0, 0);
    } else {
      octx.setTransform(dpr, 0, 0, dpr, 0, 0);
      octx.clearRect(0, 0, w, h);
      drawCyberScene(octx, w, h, st.val, kx, st.t, st.shock);
    }

    for (let i = 0; i < 5; i++) {
      const dx = pad + (i / 4) * (w - pad * 2);
      octx.fillStyle = i <= st.idx ? 'rgba(255,255,255,0.88)' : 'rgba(255,255,255,0.25)';
      octx.beginPath(); octx.arc(dx, h - 4.2, i === st.idx ? 1.8 : 1.0, 0, Math.PI * 2); octx.fill();
    }

    if (st.flash > 0.01) {
      octx.save();
      octx.fillStyle = sampleColor(FLASHES, st.val);
      octx.globalAlpha = st.flash;
      octx.fillRect(0, 0, w, h);
      octx.restore();
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = mode !== 'pixel';
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(off, 0, 0);

    // Liquid glass lens
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const kw = 50 + st.chroma * 3, kh = 44 - st.chroma * 1.4, kr = kh / 2;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.44)'; ctx.shadowBlur = st.drag ? 14 : 9; ctx.shadowOffsetY = 2.5;
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.roundRect(kx - kw/2, ky - kh/2, kw, kh, kr); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.beginPath(); ctx.roundRect(kx - kw/2, ky - kh/2, kw, kh, kr); ctx.clip();
    ctx.imageSmoothingEnabled = mode !== 'pixel';
    const mag = st.drag ? 1.32 : 1.22;
    const sw = (kw / mag) * dpr, sh = (kh / mag) * dpr;
    const sx = clamp(kx * dpr - sw/2, 0, cw - sw);
    const sy = clamp(ky * dpr - sh/2, 0, ch - sh);
    ctx.drawImage(off, sx, sy, sw, sh, kx - kw/2, ky - kh/2, kw, kh);

    const disp = 1.2 + st.chroma * 2.6;
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.18 + st.chroma * 0.25;
    ctx.drawImage(off, Math.max(0, sx - disp * dpr), sy, sw, sh, kx - kw/2 - disp, ky - kh/2, kw, kh);
    ctx.drawImage(off, Math.min(cw - sw, sx + disp * dpr), sy, sw, sh, kx - kw/2 + disp, ky - kh/2, kw, kh);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

    const gg = ctx.createLinearGradient(kx, ky - kh/2, kx, ky + kh/2);
    gg.addColorStop(0, 'rgba(255,255,255,0.34)'); gg.addColorStop(0.2, 'rgba(255,255,255,0.02)');
    gg.addColorStop(0.84, 'rgba(255,255,255,0.01)'); gg.addColorStop(1, 'rgba(255,255,255,0.22)');
    ctx.fillStyle = gg; ctx.fillRect(kx - kw/2, ky - kh/2, kw, kh);
    ctx.fillStyle = 'rgba(255,255,255,0.68)';
    ctx.beginPath(); ctx.ellipse(kx - 2, ky - kh * 0.36, kw * 0.28, kh * 0.06, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    const rg = ctx.createLinearGradient(kx, ky - kh/2, kx, ky + kh/2);
    rg.addColorStop(0, 'rgba(255,255,255,0.92)');
    rg.addColorStop(0.5, 'rgba(255,255,255,0.28)');
    rg.addColorStop(1, sampleColor(ACCENTS, st.val));
    ctx.strokeStyle = rg; ctx.lineWidth = st.drag || st.chroma > 0.2 ? 1.8 : 1.3;
    ctx.beginPath(); ctx.roundRect(kx - kw/2 + 0.65, ky - kh/2 + 0.65, kw - 1.3, kh - 1.3, kr); ctx.stroke();
    ctx.restore();

    // Update 5 live mini-strips for this panel
    const tSec = now / 1000;
    for (const m of miniCtrls) {
      const mw = Math.max(160, m.mc.clientWidth || 280), mh = 36;
      const mcw = Math.round(mw * dpr), mch = Math.round(mh * dpr);
      if (m.mc.width !== mcw || m.mc.height !== mch) { m.mc.width = mcw; m.mc.height = mch; }
      if (mode === 'pixel') {
        const maw = Math.round(mw / 1.4);
        if (m.mart.width !== maw || m.mart.height !== PX_H) { m.mart.width = maw; m.mart.height = PX_H; }
        m.mactx.clearRect(0, 0, maw, PX_H);
        const { nx, ny } = drawPixelScene(m.mactx, maw, m.mp, m.mp, tSec, m.mpool, 0);
        stepPxParticles(m.mpool, dt, m.mp, nx, ny, maw);
        m.mctx.setTransform(1, 0, 0, 1, 0, 0);
        m.mctx.imageSmoothingEnabled = false;
        m.mctx.clearRect(0, 0, mcw, mch);
        m.mctx.drawImage(m.mart, 0, 0, mcw, mch);
      } else {
        m.mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        m.mctx.clearRect(0, 0, mw, mh);
        drawCyberScene(m.mctx, mw, mh, m.mp, 26 + m.mp * (mw - 52), tSec, 0);
      }
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return { setIdx };
}

const cPixel = mountStylePanel(document.getElementById('panelPixel'), 'pixel', BEATS_PX);
const cCyber = mountStylePanel(document.getElementById('panelCyber'), 'cyber', BEATS_CY);

let timer = null;
document.getElementById('resetBtn').onclick = () => {
  if (timer) clearInterval(timer);
  cPixel.setIdx(0, false); cCyber.setIdx(0, false);
};
document.getElementById('demoBtn').onclick = () => {
  if (timer) clearInterval(timer);
  let step = 0;
  cPixel.setIdx(0, false); cCyber.setIdx(0, false);
  timer = setInterval(() => {
    step++;
    if (step > 4) { clearInterval(timer); timer = null; return; }
    cPixel.setIdx(step, true); cCyber.setIdx(step, true);
  }, 750);
};
</script>
</body>
</html>
