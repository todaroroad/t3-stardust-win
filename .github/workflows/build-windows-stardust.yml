name: Sync Official T3 & Release T3M版 (Windows & Linux)

on:
  schedule:
    # Daily check at 20:30 UTC (04:30 CST) for new stable pingdotgg/t3code releases
    - cron: "30 20 * * *"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild & release even if already synced to latest official stable tag"
        required: false
        default: false
        type: boolean
      official_tag:
        description: "Optional specific official tag to merge (e.g. v0.1.13); leave empty for latest stable"
        required: false
        default: ""
        type: string
      platform_scope:
        description: "Platforms to build & publish: all (Windows + Linux), linux-only, or windows-only"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - linux-only
          - windows-only
      reuse_release_version:
        description: "Optional existing release version (e.g. 1.13.12) to attach/rebuild without bumping semver"
        required: false
        default: ""
        type: string

concurrency:
  group: stardust-windows-release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  prepare_and_build_bundle:
    name: Merge Official T3, Build Bundle & Package Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      should_build: ${{ steps.sync.outputs.should_build }}
      build_windows: ${{ steps.sync.outputs.build_windows }}
      build_linux: ${{ steps.sync.outputs.build_linux }}
      checkout_sha: ${{ steps.finalize.outputs.checkout_sha }}
      release_version: ${{ steps.sync.outputs.release_version }}
      official_tag: ${{ steps.sync.outputs.official_tag }}
      official_sha: ${{ steps.sync.outputs.official_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Check official pingdotgg/t3code stable release & run 3-way merge if needed
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REBUILD: ${{ inputs.force_rebuild == true && 'true' || 'false' }}
          INPUT_TAG: ${{ inputs.official_tag || '' }}
          PLATFORM_SCOPE: ${{ inputs.platform_scope || 'all' }}
          REUSE_RELEASE_VERSION: ${{ inputs.reuse_release_version || '' }}
        run: |
          set -euo pipefail

          REUSE_VER="${REUSE_RELEASE_VERSION#v}"
          BUILD_WINDOWS="false"
          BUILD_LINUX="false"
          if [[ "${PLATFORM_SCOPE}" == "all" || "${PLATFORM_SCOPE}" == "windows-only" ]]; then
            BUILD_WINDOWS="true"
          fi
          if [[ "${PLATFORM_SCOPE}" == "all" || "${PLATFORM_SCOPE}" == "linux-only" ]]; then
            BUILD_LINUX="true"
          fi
          echo "build_windows=${BUILD_WINDOWS}" >> "$GITHUB_OUTPUT"
          echo "build_linux=${BUILD_LINUX}" >> "$GITHUB_OUTPUT"

          OFFICIAL_REPO="pingdotgg/t3code"
          RECORDED_TAG=""
          if [[ -f .official-upstream-tag ]]; then
            RECORDED_TAG="$(tr -d '[:space:]' < .official-upstream-tag)"
          fi
          RECORDED_SHA=""
          if [[ -f .official-upstream-sha ]]; then
            RECORDED_SHA="$(tr -d '[:space:]' < .official-upstream-sha)"
          fi

          if [[ -n "${INPUT_TAG}" ]]; then
            TARGET_TAG="${INPUT_TAG}"
          elif [[ -n "${REUSE_VER}" && -n "${RECORDED_TAG}" ]]; then
            TARGET_TAG="${RECORDED_TAG}"
          else
            TARGET_TAG="$(gh api "repos/${OFFICIAL_REPO}/releases?per_page=30" --jq '
              [.[] | select((.draft | not) and (.prerelease | not) and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | .[0].tag_name // empty
            ')"
          fi
          if [[ -z "${TARGET_TAG}" ]]; then
            TARGET_TAG="${RECORDED_TAG:-v0.1.13}"
          fi
          TARGET_SHA="$(gh api "repos/${OFFICIAL_REPO}/commits/${TARGET_TAG}" --jq '.sha')"

          echo "Official latest stable : ${TARGET_TAG} (${TARGET_SHA})"
          echo "Recorded local base    : ${RECORDED_TAG:-<none>} (${RECORDED_SHA:-<none>})"
          echo "Platform scope         : ${PLATFORM_SCOPE} (win=${BUILD_WINDOWS}, linux=${BUILD_LINUX})"

          NEEDS_MERGE="false"
          if [[ -z "${REUSE_VER}" && ( "${EVENT_NAME}" == "schedule" || "${EVENT_NAME}" == "workflow_dispatch" ) ]]; then
            if [[ "${TARGET_TAG}" != "${RECORDED_TAG}" ]]; then
              NEEDS_MERGE="true"
            elif [[ "${EVENT_NAME}" == "schedule" ]]; then
              echo "Already synced to official ${TARGET_TAG}. Skipping build."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            elif [[ "${FORCE_REBUILD}" != "true" ]]; then
              echo "Already synced to official ${TARGET_TAG} and force_rebuild=false. Skipping build."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "needs_merge=${NEEDS_MERGE}" >> "$GITHUB_OUTPUT"
          echo "official_tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"
          echo "official_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"

          if [[ "${NEEDS_MERGE}" == "true" ]]; then
            BASE_REF="${RECORDED_SHA:-${RECORDED_TAG}}"
            if [[ -z "${BASE_REF}" ]]; then
              echo "ERROR: Missing .official-upstream-tag / .official-upstream-sha for 3-way merge."
              exit 1
            fi
            echo "Performing 3-way merge from official ${BASE_REF} -> ${TARGET_TAG}..."

            WORK_TMP="$(mktemp -d)"
            mkdir -p "$WORK_TMP/base" "$WORK_TMP/target" "$WORK_TMP/synth"

            curl -fsSL "https://codeload.github.com/${OFFICIAL_REPO}/tar.gz/${BASE_REF}" \
              | tar -xz -C "$WORK_TMP/base" --strip-components=1
            rm -rf "$WORK_TMP/base/.repos" "$WORK_TMP/base/.github/workflows"

            curl -fsSL "https://codeload.github.com/${OFFICIAL_REPO}/tar.gz/${TARGET_TAG}" \
              | tar -xz -C "$WORK_TMP/target" --strip-components=1
            rm -rf "$WORK_TMP/target/.repos" "$WORK_TMP/target/.github/workflows"

            git -C "$WORK_TMP/synth" init -q
            git -C "$WORK_TMP/synth" config user.name "github-actions[bot]"
            git -C "$WORK_TMP/synth" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git --git-dir="$WORK_TMP/synth/.git" --work-tree="$WORK_TMP/base" add -A
            git --git-dir="$WORK_TMP/synth/.git" --work-tree="$WORK_TMP/base" commit -q -m "chore(official): base ${RECORDED_TAG}"
            BASE_COMMIT="$(git -C "$WORK_TMP/synth" rev-parse HEAD)"

            git --git-dir="$WORK_TMP/synth/.git" --work-tree="$WORK_TMP/target" add -A
            git --git-dir="$WORK_TMP/synth/.git" --work-tree="$WORK_TMP/target" commit -q -m "chore(official): release ${TARGET_TAG}"
            TARGET_COMMIT="$(git -C "$WORK_TMP/synth" rev-parse HEAD)"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config merge.renameLimit 30000

            git remote add official-synth "$WORK_TMP/synth"
            git fetch -q official-synth

            HEAD_SHA="$(git rev-parse HEAD)"
            TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
            ANCHOR_SHA="$(git commit-tree "$TREE_SHA" -p "$HEAD_SHA" -p "$BASE_COMMIT" -m "chore(upstream): anchor official ${RECORDED_TAG}")"
            git checkout -B "sync-work" "$ANCHOR_SHA"

            set +e
            git merge --no-commit --no-ff "$TARGET_COMMIT"
            MERGE_CODE=$?
            set -e

            rm -rf "$WORK_TMP"

            if [[ $MERGE_CODE -ne 0 ]]; then
              if git diff --name-only --diff-filter=U | grep -qx "pnpm-lock.yaml"; then
                git checkout --theirs pnpm-lock.yaml
                git add pnpm-lock.yaml
              fi
              for keep_ours in .github/workflows stardust-win README.md; do
                if git diff --name-only --diff-filter=U | grep -q "^${keep_ours}"; then
                  git checkout --ours -- "$keep_ours" || true
                  git add -- "$keep_ours" || true
                fi
              done
            fi

            REMAINING_CONFLICTS="$(git diff --name-only --diff-filter=U || true)"
            if [[ -n "${REMAINING_CONFLICTS}" ]]; then
              echo "Merge conflicts detected on ${TARGET_TAG}:"
              echo "${REMAINING_CONFLICTS}"
              CONFLICT_BRANCH="sync/official-${TARGET_TAG}"
              git checkout -B "$CONFLICT_BRANCH" "$HEAD_SHA"
              git push -f origin "$CONFLICT_BRANCH"

              ISSUE_TITLE="⚠️ T3星辰版自动同步提示：官方 ${TARGET_TAG} 存在代码交集冲突需适配"
              EXISTING_ISSUE="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')"
              BODY="$(printf '检测到 T3 官方发布新正式版 **`%s`**（`%s`），自动三方合并时以下交集文件存在冲突，**主分支 `main` 未受任何影响**：\n\n```\n%s\n```\n\n您可以在 T3 中直接对 AI 说：\n> 帮我把 `todaroroad/t3-stardust-win` 合并适配官方 `%s` 的冲突并打包发布' "$TARGET_TAG" "${TARGET_SHA:0:10}" "$REMAINING_CONFLICTS" "$TARGET_TAG")"
              if [[ -z "${EXISTING_ISSUE}" ]]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$BODY"
              fi
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            rm -rf .repos
            printf '%s\n' "$TARGET_TAG" > .official-upstream-tag
            printf '%s\n' "$TARGET_SHA" > .official-upstream-sha
          fi

          if [[ -n "${REUSE_VER}" ]]; then
            RELEASE_VERSION="${REUSE_VER}"
            echo "Reusing explicit release version: ${RELEASE_VERSION}"
          else
            # Compute strictly monotonic semver 1.<official_minor>.<patch> for electron-updater
            RELEASE_VERSION="$(OFFICIAL_TAG_VAL="${TARGET_TAG}" node -e '
              const { execFileSync } = require("node:child_process");

              function parseVer(v) {
                const m = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(String(v).trim());
                return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
              }
              function cmp(a, b) {
                for (let i = 0; i < 3; i++) {
                  if (a[i] !== b[i]) return a[i] - b[i];
                }
                return 0;
              }

              const off = parseVer(process.env.OFFICIAL_TAG_VAL || "v0.1.13") || [0, 1, 13];
              const mappedMajor = off[0] >= 1 ? off[0] + 1 : 1;
              const mappedMinor = off[0] === 0 && off[1] === 1 ? off[2] : off[1] * 100 + off[2];
              const base = [mappedMajor, mappedMinor, 0];

              let tags = [];
              try {
                const out = execFileSync(
                  "gh",
                  ["release", "list", "--repo", process.env.GITHUB_REPOSITORY, "--limit", "50", "--json", "tagName,isDraft"],
                  { encoding: "utf8" }
                );
                tags = JSON.parse(out)
                  .filter((r) => !r.isDraft)
                  .map((r) => parseVer(r.tagName))
                  .filter(Boolean);
              } catch {}

              tags.sort(cmp);
              const highest = tags.length > 0 ? tags[tags.length - 1] : null;
              let next = base;
              if (highest && cmp(next, highest) <= 0) {
                next = [highest[0], highest[1], highest[2] + 1];
              }
              process.stdout.write(next.join("."));
            ')"
            echo "Resolved monotonic release version: ${RELEASE_VERSION}"
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Apply & verify T3M版 pure-official overlay
        if: steps.sync.outputs.should_build == 'true'
        run: node stardust-win/apply-overlay.mjs

      - name: Load public configuration
        if: steps.sync.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for name in T3CODE_CLERK_PUBLISHABLE_KEY T3CODE_CLERK_JWT_TEMPLATE T3CODE_CLERK_CLI_OAUTH_CLIENT_ID T3CODE_RELAY_URL; do
            value="$(sed -n "s/^${name}=//p" .env.example | head -n 1)"
            if [[ -n "$value" ]]; then
              echo "${name}=${value}" >> "$GITHUB_ENV"
            fi
          done
          echo "T3CODE_DESKTOP_UPDATE_REPOSITORY=${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"

      - name: Setup Vite+
        if: steps.sync.outputs.should_build == 'true'
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install Linux build headers & patchelf
        if: steps.sync.outputs.should_build == 'true'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config patchelf libatomic1

      - name: Install bundle dependencies
        if: steps.sync.outputs.should_build == 'true'
        run: |
          if [[ "${{ steps.sync.outputs.needs_merge }}" == "true" ]]; then
            vp install --no-frozen-lockfile --config.minimum-release-age=0 --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
          else
            vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
          fi

      - name: Cache Linux resource monitor
        id: linux_resource_monitor_cache
        if: steps.sync.outputs.should_build == 'true' && steps.sync.outputs.build_linux == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor
          key: resource-monitor-x86_64-unknown-linux-gnu-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust (Linux resource monitor)
        if: steps.sync.outputs.should_build == 'true' && steps.sync.outputs.build_linux == 'true' && steps.linux_resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build Linux resource monitor
        if: steps.sync.outputs.should_build == 'true' && steps.sync.outputs.build_linux == 'true' && steps.linux_resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Align package versions, Build JS bundle, Inject Stardust Suite & Package Linux x64 Archive
        id: build_verify
        if: steps.sync.outputs.should_build == 'true'
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ steps.sync.outputs.release_version }}
          BUILD_LINUX: ${{ steps.sync.outputs.build_linux }}
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "${RELEASE_VERSION}"
          vp run build:desktop
          node stardust-win/patch-dist-bundle.mjs apps/server/dist
          if grep -rn "xiaoxin666\|api/stardust" apps/server/dist apps/desktop/dist-electron; then
            echo "ERROR: Unexpected third-party endpoint found in compiled bundle!"
            exit 1
          fi

          if [[ "${BUILD_LINUX}" == "true" ]]; then
            echo "=== Building Linux x64 Standalone Server/CLI Release Package ==="
            mkdir -p apps/server/dist/resource-monitor/linux-x64
            cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor \
               apps/server/dist/resource-monitor/linux-x64/t3-resource-monitor
            chmod +x apps/server/dist/resource-monitor/linux-x64/t3-resource-monitor

            APP_VERSION="${RELEASE_VERSION}" node apps/server/scripts/cli.ts build-exe --verbose

            rm -rf release-linux release-linux-publish
            node scripts/build-cli-archive.ts \
              --platform linux \
              --arch x64 \
              --version "${RELEASE_VERSION}" \
              --output-dir release-linux

            WORK_LINUX="$(mktemp -d)"
            tar -xzf "release-linux/t3-${RELEASE_VERSION}-linux-x64.tar.gz" -C "$WORK_LINUX"
            mv "$WORK_LINUX/t3-${RELEASE_VERSION}-linux-x64" "$WORK_LINUX/T3-Stardust-${RELEASE_VERSION}-linux-x64"
            ln -sf t3 "$WORK_LINUX/T3-Stardust-${RELEASE_VERSION}-linux-x64/t3m"
            printf '%s\n' "${RELEASE_VERSION}" > "$WORK_LINUX/T3-Stardust-${RELEASE_VERSION}-linux-x64/.install-complete"

            SMOKE_OUT="$("$WORK_LINUX/T3-Stardust-${RELEASE_VERSION}-linux-x64/t3m" --version)"
            echo "Linux standalone SEA smoke-test: ${SMOKE_OUT}"
            if [[ "${SMOKE_OUT}" != *"${RELEASE_VERSION}"* ]]; then
              echo "ERROR: Unexpected Linux SEA version output: ${SMOKE_OUT}"
              exit 1
            fi
            grep -q "stardust-enhancer.js" "$WORK_LINUX/T3-Stardust-${RELEASE_VERSION}-linux-x64/client/index.html"

            mkdir -p release-linux-publish
            tar --hard-dereference -czf "release-linux-publish/T3-Stardust-${RELEASE_VERSION}-linux-x64.tar.gz" \
              -C "$WORK_LINUX" "T3-Stardust-${RELEASE_VERSION}-linux-x64"
            rm -rf "$WORK_LINUX" release-linux apps/server/dist/resource-monitor
            ls -lh release-linux-publish/
          fi

          echo "Build, bundle enhancement & verification passed!"

      - name: Handle build failure on automated merge without breaking main
        if: steps.sync.outputs.should_build == 'true' && steps.build_verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ steps.sync.outputs.official_tag }}
          NEEDS_MERGE: ${{ steps.sync.outputs.needs_merge }}
        run: |
          set -euo pipefail
          if [[ "${NEEDS_MERGE}" == "true" ]]; then
            ISSUE_TITLE="⚠️ T3星辰版自动同步提示：官方 ${TARGET_TAG} 合并后编译需适配"
            EXISTING_ISSUE="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')"
            if [[ -z "${EXISTING_ISSUE}" ]]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" \
                --body "官方 **\`${TARGET_TAG}\`** Git 合并无文本冲突，但 TypeScript / Vite 编译校验未通过（可能上游调整了组件 Props 或协议字段）。**主分支 \`main\` 未被修改**，请查看本次 Actions 日志或在 T3 中让 AI 协助适配。"
            fi
          fi
          exit 1

      - name: Commit verified official merge back to main (if merged)
        id: finalize
        if: steps.sync.outputs.should_build == 'true' && steps.build_verify.outcome == 'success'
        env:
          NEEDS_MERGE: ${{ steps.sync.outputs.needs_merge }}
          TARGET_TAG: ${{ steps.sync.outputs.official_tag }}
          RELEASE_VERSION: ${{ steps.sync.outputs.release_version }}
        run: |
          set -euo pipefail
          git checkout -- package.json apps/*/package.json packages/*/package.json 2>/dev/null || true
          if [[ "${NEEDS_MERGE}" == "true" && -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit --no-verify -m "chore(sync): merge official pingdotgg/t3code ${TARGET_TAG} for T3星辰版 v${RELEASE_VERSION} [skip ci]"
            git push origin HEAD:main
          fi
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          echo "checkout_sha=${CHECKOUT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload verified JS bundle (for Windows job)
        if: steps.sync.outputs.should_build == 'true' && steps.build_verify.outcome == 'success' && steps.sync.outputs.build_windows == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 3

      - name: Upload Linux x64 Release Archive
        if: steps.sync.outputs.should_build == 'true' && steps.build_verify.outcome == 'success' && steps.sync.outputs.build_linux == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "T3-Stardust-${{ steps.sync.outputs.release_version }}-Linux-x64"
          path: release-linux-publish/*
          if-no-files-found: error

  package_windows:
    name: Package Windows x64 Installer & Update Feed
    needs: [prepare_and_build_bundle]
    if: needs.prepare_and_build_bundle.outputs.should_build == 'true' && needs.prepare_and_build_bundle.outputs.build_windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout verified commit
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.prepare_and_build_bundle.outputs.checkout_sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Load public configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in T3CODE_CLERK_PUBLISHABLE_KEY T3CODE_CLERK_JWT_TEMPLATE T3CODE_CLERK_CLI_OAUTH_CLIENT_ID T3CODE_RELAY_URL; do
            value="$(sed -n "s/^${name}=//p" .env.example | head -n 1)"
            if [[ -n "$value" ]]; then
              echo "${name}=${value}" >> "$GITHUB_ENV"
            fi
          done
          echo "T3CODE_DESKTOP_UPDATE_REPOSITORY=${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install desktop dependencies
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          key: resource-monitor-x86_64-pc-windows-msvc-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Spectre-mitigated MSVC libs
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Align package versions
        env:
          RELEASE_VERSION: ${{ needs.prepare_and_build_bundle.outputs.release_version }}
        run: node scripts/update-release-package-versions.ts "${RELEASE_VERSION}"

      - name: Download verified JS bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: js-bundle
          path: apps

      - name: Build Windows NSIS Installer & electron-updater Metadata
        shell: bash
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
          T3CODE_DESKTOP_WEB_ASSET_BRAND: production
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          RELEASE_VERSION: ${{ needs.prepare_and_build_bundle.outputs.release_version }}
        run: |
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${RELEASE_VERSION}" \
            --skip-build \
            --verbose

      - name: Stage Windows Installer & electron-updater Feed
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare_and_build_bundle.outputs.release_version }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release-win-publish | Out-Null

          $exeName = "T3-Stardust-${env:RELEASE_VERSION}-x64.exe"
          $requiredFiles = @(
            "release\$exeName",
            "release\$exeName.blockmap",
            "release\latest.yml"
          )
          foreach ($f in $requiredFiles) {
            if (-not (Test-Path $f)) {
              Get-ChildItem release | Select-Object Name, Length
              throw "Required auto-update artifact missing: $f"
            }
            Copy-Item $f -Destination "release-win-publish\$(Split-Path $f -Leaf)"
          }

          Write-Output "=== Generated latest.yml ==="
          Get-Content "release-win-publish\latest.yml"

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "T3-Stardust-${{ needs.prepare_and_build_bundle.outputs.release_version }}-Windows-x64"
          path: release-win-publish/*
          if-no-files-found: error

  publish_release:
    name: Publish GitHub Release (Windows + Linux)
    needs: [prepare_and_build_bundle, package_windows]
    if: >-
      always() &&
      needs.prepare_and_build_bundle.result == 'success' &&
      needs.prepare_and_build_bundle.outputs.should_build == 'true' &&
      (needs.package_windows.result == 'success' || needs.package_windows.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download Windows Release Artifacts
        if: needs.prepare_and_build_bundle.outputs.build_windows == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: "T3-Stardust-${{ needs.prepare_and_build_bundle.outputs.release_version }}-Windows-x64"
          path: release-publish

      - name: Download Linux Release Artifacts
        if: needs.prepare_and_build_bundle.outputs.build_linux == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: "T3-Stardust-${{ needs.prepare_and_build_bundle.outputs.release_version }}-Linux-x64"
          path: release-publish

      - name: Compute unified SHA256SUMS.txt & Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare_and_build_bundle.outputs.release_version }}
          OFFICIAL_TAG: ${{ needs.prepare_and_build_bundle.outputs.official_tag }}
          OFFICIAL_SHA: ${{ needs.prepare_and_build_bundle.outputs.official_sha }}
        run: |
          set -euo pipefail
          mkdir -p release-publish
          tag="v${RELEASE_VERSION}"

          EXISTING_SUMS="$(mktemp)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "SHA256SUMS.txt" --output "$EXISTING_SUMS" --clobber 2>/dev/null || true
          fi

          (
            cd release-publish
            rm -f SHA256SUMS.txt
            NEW_SUMS="$(mktemp)"
            sha256sum * > "$NEW_SUMS"
            if [[ -s "$EXISTING_SUMS" ]]; then
              awk '
                NR==FNR { seen[$2]=$0; next }
                !($2 in seen) { seen[$2]=$0 }
                END { for (k in seen) print seen[k] }
              ' "$NEW_SUMS" "$EXISTING_SUMS" | sort -k2 > SHA256SUMS.txt
            else
              sort -k2 "$NEW_SUMS" > SHA256SUMS.txt
            fi
            rm -f "$NEW_SUMS" "$EXISTING_SUMS"
            echo "=== Unified SHA256SUMS.txt ==="
            cat SHA256SUMS.txt
          )

          title="T3M版 v${RELEASE_VERSION} for Windows & Linux (x64) [纯净官方 ${OFFICIAL_TAG} 增强版]"
          notes="T3M版 v${RELEASE_VERSION} Windows & Linux x64 纯净增强版（基于 T3 官方正式版 pingdotgg/t3code@${OFFICIAL_TAG} / ${OFFICIAL_SHA:0:7}）：
          - **Windows 桌面安装包**：\`T3-Stardust-${RELEASE_VERSION}-x64.exe\`（支持 \`latest.yml\` 自动检查更新）
          - **Linux 服务端/CLI 独立发行包**：\`T3-Stardust-${RELEASE_VERSION}-linux-x64.tar.gz\`（内置 Node SEA 单二进制 \`t3m\`/\`t3\`、完整增强版网页端、Linux 原生依赖与 \`libatomic.so.1\`，免环境解压即跑，适配 Debian / Ubuntu / GCP / AWS 等云服务器）
          - 品牌焕新为 T3M版 + 深蓝炫彩 T3✦ 图标；「所有项目」三段式工作台与自定义分类分组弹窗
          - Antigravity（反重力）实时配额探针、顶栏 5h/周双指标横向滚轮胶囊、底部双段统计栏与不挡字的实时执行动态胶囊"

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" release-publish/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes "$notes" \
              --latest
          else
            gh release upload "$tag" release-publish/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes "$notes" \
              --latest
          fi
